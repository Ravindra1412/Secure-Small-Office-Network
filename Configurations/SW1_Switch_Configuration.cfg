! ==============================================================================
! Cisco Catalyst 2960-24TT Switch Configuration: SW1
! Project: Secure Small Office Network using VLANs and Port Security
! Course: BCSE308P Computer Networks Lab
! ==============================================================================

version 15.0
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname SW1
!
! --- VLAN Definition ---
vlan 10
 name HR
!
vlan 20
 name IT
!
vlan 30
 name SALES
!
! --- Access Ports: HR Department (VLAN 10) ---
interface range FastEthernet0/1 - 3
 description HR Department Workstations
 switchport mode access
 switchport access vlan 10
!
! --- Access Ports: IT Department (VLAN 20) ---
interface range FastEthernet0/4 - 6
 description IT Department Workstations
 switchport mode access
 switchport access vlan 20
!
! --- Access Ports: Sales Department (VLAN 30) ---
interface range FastEthernet0/7 - 9
 description Sales Department Workstations
 switchport mode access
 switchport access vlan 30
!
! --- Access Port: Company Central Server (VLAN 10) ---
interface FastEthernet0/10
 description Company Central Server (HTTP/DNS)
 switchport mode access
 switchport access vlan 10
!
! --- Trunk Port to Router R1 (802.1Q) ---
interface GigabitEthernet0/1
 description 802.1Q Trunk Link to Router R1 Gi0/0
 switchport mode trunk
 switchport nonegotiate
!
! --- Switch Port Security Configuration (Fa0/1 - Fa0/9) ---
interface range FastEthernet0/1 - 9
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
!
end
