! ==============================================================================
! Cisco 2911 Integrated Services Router Configuration: R1
! Project: Secure Small Office Network using Inter-VLAN Routing, DHCP, and ACL
! Course: BCSE308P Computer Networks Lab
! ==============================================================================

version 15.1
service timestamps log datetime msec
service timestamps debug datetime msec
no service password-encryption
!
hostname R1
!
! --- DHCP Address Exclusions (Reserved .1 - .20 for static devices/gateways) ---
ip dhcp excluded-address 192.168.10.1 192.168.10.20
ip dhcp excluded-address 192.168.20.1 192.168.20.20
ip dhcp excluded-address 192.168.30.1 192.168.30.20
!
! --- DHCP Pool: HR Department (VLAN 10) ---
ip dhcp pool HR_POOL
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.10.10
!
! --- DHCP Pool: IT Department (VLAN 20) ---
ip dhcp pool IT_POOL
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.10.10
!
! --- DHCP Pool: Sales Department (VLAN 30) ---
ip dhcp pool SALES_POOL
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.10.10
!
! --- Physical Interface connected to SW1 Gi0/1 ---
interface GigabitEthernet0/0
 description Trunk interface to SW1
 no ip address
 duplex auto
 speed auto
 no shutdown
!
! --- Router-on-a-Stick Subinterface: VLAN 10 (HR) ---
interface GigabitEthernet0/0.10
 description Gateway for HR Department (VLAN 10)
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
! --- Router-on-a-Stick Subinterface: VLAN 20 (IT) ---
interface GigabitEthernet0/0.20
 description Gateway for IT Department (VLAN 20)
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
! --- Router-on-a-Stick Subinterface: VLAN 30 (Sales) ---
interface GigabitEthernet0/0.30
 description Gateway for Sales Department (VLAN 30)
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip access-group SALES_RESTRICTION in
!
! --- Extended Access Control List: SALES_RESTRICTION ---
! Permitted: Sales (192.168.30.0/24) can access Company-Server (192.168.10.10)
! Denied:    Sales (192.168.30.0/24) cannot access HR subnet (192.168.10.0/24)
! Permitted: Sales can access all other destinations (IT subnet, etc.)
ip access-list extended SALES_RESTRICTION
 permit ip 192.168.30.0 0.0.0.255 host 192.168.10.10
 deny   ip 192.168.30.0 0.0.0.255 192.168.10.0 0.0.0.255
 permit ip any any
!
end
